name: release
# A v* tag push: `test` (read-only token) checks the tag and runs `make ci` in the dev container;
# `publish` (needs test) only creates the GitHub release and is the one job with contents: write.
# Both jobs check that the tag is semver and on main.
# Repository settings this relies on (not expressible in this file), set on the public repository
# before any tag push:
#  - environment `release`: required reviewer = the maintainer (self-approval allowed), deployment
#    branches and tags limited to the tag pattern `v*`;
#  - a `v*` tag ruleset, so a tag can't be moved between `test` and `publish`.
# `publish` fails closed until then: it refuses in a private repository (GitHub Free can't give a
# private repository's environment a required reviewer, so `environment:` alone gates nothing),
# and it checks through the API (actions: read) that `release` has a required reviewer and only
# the `v*` tag policy. The environment gate runs before the job starts, so a passing check means
# the approval was required.
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be semver and on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not semver: $GITHUB_REF_NAME"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/vibe-ports/yang-dev
          cacheFrom: ghcr.io/vibe-ports/yang-dev
          push: never
          runCmd: make ci
  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read # read the `release` environment's protection rules
    steps:
      - name: Release environment must be protected
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          [[ "$PRIVATE" == false ]] || { echo "::error::repository is private: no required-reviewer environment, refusing to publish"; exit 1; }
          env=$(gh api "repos/$GITHUB_REPOSITORY/environments/release") || { echo "::error::cannot read the release environment"; exit 1; }
          jq -e '[.protection_rules[]? | select(.type == "required_reviewers" and (.reviewers | length) > 0)] | length > 0' <<<"$env" >/dev/null ||
            { echo "::error::environment release has no required reviewer"; exit 1; }
          jq -e '.deployment_branch_policy.custom_branch_policies == true' <<<"$env" >/dev/null ||
            { echo "::error::environment release does not restrict deployment refs"; exit 1; }
          pol=$(gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" --jq '[.branch_policies[] | "\(.type):\(.name)"] | join(",")') ||
            { echo "::error::cannot read the release deployment policies"; exit 1; }
          [[ "$pol" == "tag:v*" ]] || { echo "::error::environment release must allow only tag v*, has '$pol'"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be semver and on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not semver: $GITHUB_REF_NAME"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
