name: libyang-sync
# Weekly: keep the pinned libyang oracle in sync with upstream releases (like Dependabot).
#  - new release  → PR bumping Dockerfile pins + regenerated goldens (golden diff = behaviour change)
#  - master drift → one tracking issue listing upstream commits since the pinned tag that touch src/
# Upstream code (libyang) is built and run only in the `goldens` job, which holds a read-only
# token and no persisted git credentials. The write token lives in `pr`, which runs no upstream or
# repository code: it applies the uploaded patch (only pin/golden paths allowed) and opens the PR.
# Upstream tag names and SHAs are validated before any use and reach shells only through env.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cur: ${{ steps.check.outputs.cur }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cur=$(sed -n 's/^ARG LIBYANG_REF=//p' Dockerfile)
          tag=$(gh api repos/CESNET/libyang/releases/latest --jq .tag_name)
          ver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ $cur =~ $ver ]] || { echo "::error::Dockerfile LIBYANG_REF is not vX.Y.Z"; exit 1; }
          [[ $tag =~ $ver ]] || { echo "::error::upstream latest release tag is not vX.Y.Z"; exit 1; }
          sha=$(gh api "repos/CESNET/libyang/commits/$tag" --jq .sha)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::upstream commit is not a 40-hex SHA"; exit 1; }
          echo "cur=$cur tag=$tag sha=$sha"
          { echo "cur=$cur"; echo "tag=$tag"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

  drift:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CUR: ${{ needs.check.outputs.cur }}
    steps:
      - name: Tracking issue for upstream master drift
        run: |
          [[ $CUR =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          list=$(gh api "repos/CESNET/libyang/compare/$CUR...master" --paginate \
            --jq '.commits[] | "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0])"' | tail -n 200)
          files=$(gh api "repos/CESNET/libyang/compare/$CUR...master" --jq '[.files[].filename | select(startswith("src/"))] | unique | join(", ")')
          body=$(printf 'Upstream libyang commits on master since pinned **%s** (updated weekly by libyang-sync).\n\nTouched src/ files: %s\n\nCross-check with docs/port-map.md before porting further.\n\n%s\n' "$CUR" "${files:-none}" "${list:-none}")
          num=$(gh issue list --state open --label upstream-drift --json number --jq '.[0].number // empty')
          gh label create upstream-drift --color BFD4F2 --force >/dev/null
          if [ -n "$num" ]; then gh issue edit "$num" --body "$body"; else gh issue create --title "upstream libyang drift since $CUR" --label upstream-drift --body "$body"; fi

  goldens:
    needs: check
    if: needs.check.outputs.cur != needs.check.outputs.tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bump pins
        env:
          LIBYANG_TAG: ${{ needs.check.outputs.tag }}
          LIBYANG_SHA: ${{ needs.check.outputs.sha }}
        run: |
          [[ $LIBYANG_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ $LIBYANG_SHA =~ ^[0-9a-f]{40}$ ]] || exit 1
          sed -i "s/^ARG LIBYANG_REF=.*/ARG LIBYANG_REF=$LIBYANG_TAG/; s/^ARG LIBYANG_COMMIT=.*/ARG LIBYANG_COMMIT=$LIBYANG_SHA/" Dockerfile
          # Only the oracle pin moves. Provenance headers/docs keep the version code was ported from.
          sed -i "s/^  libyang: .*/  libyang: $LIBYANG_TAG/; s/^  libyang_commit: .*/  libyang_commit: $LIBYANG_SHA/" conformance/corpus/manifest.yaml
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate goldens with the new libyang
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/vibe-ports/yang-dev
          cacheFrom: ghcr.io/vibe-ports/yang-dev
          push: never
          runCmd: make oracle-golden
      - run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/libyang-sync.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libyang-sync-patch
          path: ${{ runner.temp }}/libyang-sync.patch
          retention-days: 3

  pr:
    needs: [check, goldens]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libyang-sync-patch
          path: ${{ runner.temp }}/patch
      - name: Apply the patch (pin and golden paths only)
        run: |
          p="$RUNNER_TEMP/patch/libyang-sync.patch"
          # Paths come from git's own parser; anything outside the allowed set aborts.
          bad=$(git apply --numstat -z "$p" | tr '\0' '\n' | awk -F'\t' 'NF >= 3 {print $3} NF == 1 && $1 != "" {print $1}' |
            grep -vE '^(Dockerfile|conformance/corpus/manifest\.yaml|conformance/corpus/[^/]+/golden/[^/]+\.json)$' || true)
          [[ -z $bad ]] || { echo "::error::patch touches paths outside the pins and goldens"; exit 1; }
          git apply --index "$p"
      - # A PAT/App token is needed so the PR triggers CI + ai-review (GITHUB_TOKEN PRs don't).
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          branch: deps/libyang-${{ needs.check.outputs.tag }}
          commit-message: "build(deps): libyang ${{ needs.check.outputs.cur }} → ${{ needs.check.outputs.tag }}"
          title: "build(deps): libyang ${{ needs.check.outputs.cur }} → ${{ needs.check.outputs.tag }}"
          labels: dependencies, libyang
          body: |
            Upstream: https://github.com/CESNET/libyang/compare/${{ needs.check.outputs.cur }}...${{ needs.check.outputs.tag }}
            Pinned commit: `${{ needs.check.outputs.sha }}`

            Goldens were regenerated with the new oracle. **Every golden diff in this PR is a
            behaviour change in libyang** — port it (update code + docs/port-map.md) or record it
            in conformance/deviations.md before merging.
