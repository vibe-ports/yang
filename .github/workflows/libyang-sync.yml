name: libyang-sync
# Weekly: keep the pinned libyang oracle in sync with upstream releases (like Dependabot).
#  - new release  → PR bumping Dockerfile pins + regenerated goldens (golden diff = behaviour change)
#  - master drift → one tracking issue listing upstream commits since the pinned tag that touch src/
# Upstream code (libyang) is built and run only in the `goldens` job, which holds a read-only
# token and no persisted git credentials; its only output is a tarball of golden JSON files,
# treated as hostile. The write token lives in `pr`, which builds nothing: it writes the pins itself
# (sed from the validated tag/SHA), imports only regular golden JSON files from the tarball
# (scripts/import-goldens from this checkout, i.e. main) and opens the PR.
# Upstream tag names and SHAs are validated before any use and reach shells only through env.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cur: ${{ steps.check.outputs.cur }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cur=$(sed -n 's/^ARG LIBYANG_REF=//p' Dockerfile)
          tag=$(gh api repos/CESNET/libyang/releases/latest --jq .tag_name)
          ver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ $cur =~ $ver ]] || { echo "::error::Dockerfile LIBYANG_REF is not vX.Y.Z"; exit 1; }
          [[ $tag =~ $ver ]] || { echo "::error::upstream latest release tag is not vX.Y.Z"; exit 1; }
          sha=$(gh api "repos/CESNET/libyang/commits/$tag" --jq .sha)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::upstream commit is not a 40-hex SHA"; exit 1; }
          echo "cur=$cur tag=$tag sha=$sha"
          { echo "cur=$cur"; echo "tag=$tag"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

  drift:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CUR: ${{ needs.check.outputs.cur }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tracking issue for upstream master drift
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          [[ $CUR =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          cmp="repos/CESNET/libyang/compare/$CUR...master"
          # Newest 200 commits: sha, url, subject, touched src/ files and function names from the
          # hunk headers (public upstream data only; one API call per commit). scripts/jev-triage
          # is advisory: without a key or on any Jev failure it prints the plain list.
          gh api "$cmp" --paginate --jq '.commits[] | [.sha, .html_url, (.commit.message | split("\n")[0])] | @tsv' | tail -n 200 > "$RUNNER_TEMP/commits.tsv"
          : > "$RUNNER_TEMP/commits.ndjson"
          while IFS=$'\t' read -r sha url subject; do
            [[ $sha =~ ^[0-9a-f]{40}$ ]] || continue
            gh api "repos/CESNET/libyang/commits/$sha" --jq '[.files[]? | select(.filename | startswith("src/"))] as $f
              | {files: [$f[].filename],
                 functions: ([$f[] | (.patch // "") | scan("(?m)^@@[^@]*@@[^\n]*?([A-Za-z_][A-Za-z0-9_]*)\\(") | .[0]] | unique)}' > "$RUNNER_TEMP/one.json" || echo '{}' > "$RUNNER_TEMP/one.json"
            jq -c --arg sha "$sha" --arg url "$url" --arg subject "$subject" '. + {sha: $sha, url: $url, subject: $subject}' "$RUNNER_TEMP/one.json" >> "$RUNNER_TEMP/commits.ndjson"
          done < "$RUNNER_TEMP/commits.tsv"
          list=$(jq -s . "$RUNNER_TEMP/commits.ndjson" | scripts/jev-triage drift - || true)
          files=$(gh api "$cmp" --jq '[.files[].filename | select(startswith("src/"))] | unique | join(", ")')
          body=$(printf 'Upstream libyang commits on master since pinned **%s** (updated weekly by libyang-sync).\n\nTouched src/ files: %s\n\nCross-check with docs/port-map.md before porting further.\nWith TYPESAFE_API_KEY set, lines carry advisory Jev annotations (behaviour, priority; touches_ported is computed from docs/port-map.md) and are sorted by priority.\n\n%s\n' "$CUR" "${files:-none}" "${list:-none}")
          num=$(gh issue list --state open --label upstream-drift --json number --jq '.[0].number // empty')
          gh label create upstream-drift --color BFD4F2 --force >/dev/null
          if [ -n "$num" ]; then gh issue edit "$num" --body "$body"; else gh issue create --title "upstream libyang drift since $CUR" --label upstream-drift --body "$body"; fi

  goldens:
    needs: check
    if: needs.check.outputs.cur != needs.check.outputs.tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bump pins
        env:
          LIBYANG_TAG: ${{ needs.check.outputs.tag }}
          LIBYANG_SHA: ${{ needs.check.outputs.sha }}
        run: |
          [[ $LIBYANG_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ $LIBYANG_SHA =~ ^[0-9a-f]{40}$ ]] || exit 1
          sed -i "s/^ARG LIBYANG_REF=.*/ARG LIBYANG_REF=$LIBYANG_TAG/; s/^ARG LIBYANG_COMMIT=.*/ARG LIBYANG_COMMIT=$LIBYANG_SHA/" Dockerfile
          # Only the oracle pin moves. Provenance headers/docs keep the version code was ported from.
          sed -i "s/^  libyang: .*/  libyang: $LIBYANG_TAG/; s/^  libyang_commit: .*/  libyang_commit: $LIBYANG_SHA/" conformance/corpus/manifest.yaml
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate goldens with the new libyang
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/vibe-ports/yang-dev
          cacheFrom: ghcr.io/vibe-ports/yang-dev
          push: never
          runCmd: make oracle-golden
      - name: Pack changed goldens
        run: |
          git ls-files -z -m -o --exclude-standard -- 'conformance/corpus/*/golden/*.json' |
            tar --null -T - -cf "$RUNNER_TEMP/goldens.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libyang-sync-goldens
          path: ${{ runner.temp }}/goldens.tar
          retention-days: 3

  pr:
    needs: [check, goldens]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libyang-sync-goldens
          path: ${{ runner.temp }}/goldens
      - name: Import goldens (regular golden JSON files only)
        run: scripts/import-goldens "$RUNNER_TEMP/goldens/goldens.tar"
      - name: Write pins (from the validated tag/SHA, never from the artifact)
        env:
          LIBYANG_TAG: ${{ needs.check.outputs.tag }}
          LIBYANG_SHA: ${{ needs.check.outputs.sha }}
        run: |
          [[ $LIBYANG_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ $LIBYANG_SHA =~ ^[0-9a-f]{40}$ ]] || exit 1
          sed -i "s/^ARG LIBYANG_REF=.*/ARG LIBYANG_REF=$LIBYANG_TAG/; s/^ARG LIBYANG_COMMIT=.*/ARG LIBYANG_COMMIT=$LIBYANG_SHA/" Dockerfile
          sed -i "s/^  libyang: .*/  libyang: $LIBYANG_TAG/; s/^  libyang_commit: .*/  libyang_commit: $LIBYANG_SHA/" conformance/corpus/manifest.yaml
          git add Dockerfile conformance/corpus/manifest.yaml
          # Final index: goldens (checked by import-goldens) plus exactly these two pin files.
          bad=$(git diff --cached --name-status -z --no-renames | tr '\0' '\n' | paste - - |
            grep -vE $'^(A|M)\t(Dockerfile|conformance/corpus/manifest\\.yaml|conformance/corpus/[^/]+/golden/[^/]+\\.json)$' || true)
          [[ -z $bad ]] || { echo "::error::unexpected staged changes"; exit 1; }
          [[ -z $(git status --porcelain --untracked-files=all | grep -v '^[AM] ') ]] || { echo "::error::unstaged changes"; exit 1; }
      - # A PAT/App token is needed so the PR triggers CI + ai-review (GITHUB_TOKEN PRs don't).
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          branch: deps/libyang-${{ needs.check.outputs.tag }}
          commit-message: "build(deps): libyang ${{ needs.check.outputs.cur }} → ${{ needs.check.outputs.tag }}"
          title: "build(deps): libyang ${{ needs.check.outputs.cur }} → ${{ needs.check.outputs.tag }}"
          labels: dependencies, libyang
          body: |
            Upstream: https://github.com/CESNET/libyang/compare/${{ needs.check.outputs.cur }}...${{ needs.check.outputs.tag }}
            Pinned commit: `${{ needs.check.outputs.sha }}`

            Goldens were regenerated with the new oracle. **Every golden diff in this PR is a
            behaviour change in libyang** — port it (update code + docs/port-map.md) or record it
            in conformance/deviations.md before merging.
