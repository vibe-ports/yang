name: ai-review
# Claude reviews every non-draft PR from this repo. Model: Opus for risky PRs, Sonnet otherwise
# (scripts/review-tier; optional Jev escalation). Codex reviews run separately via the Codex GitHub
# app (automatic reviews), following "Code review rules" in AGENTS.md.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude:
    # Same-repo PRs only: fork PRs get no secrets (and must not spend the maintainer's plan).
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: echo "tier=$(scripts/review-tier ${{ github.event.pull_request.number }})" >> "$GITHUB_OUTPUT"
      - if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}  PR: ${{ github.event.pull_request.number }}  review tier: ${{ steps.tier.outputs.tier }}
            Review this pull request following AGENTS.md, especially "Code review rules".
            Use `gh pr diff` and read surrounding code as needed. Report only real problems,
            most severe first, as inline comments on the exact lines, plus one summary comment
            ending with a verdict line: "VERDICT: approve" or "VERDICT: changes".
          claude_args: >-
            --model ${{ steps.tier.outputs.tier == 'deep' && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"
