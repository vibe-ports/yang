fixtures:
  - id: print/ut-json-no-nested-prefix-subtree
    dir: print
    source: {url: "https://github.com/CESNET/libyang/blob/v5.8.6/tests/utests/data/test_printer_json.c", commit: 47351e59e2965e350f9d4098f15ecbe6b3850f6f, license: BSD-3-Clause}   # test_no_json_nested_prefix:139-153
    rfc: []   # libyang LYD_PRINT_JSON_NO_NESTED_PREFIX is a non-RFC printer option
    areas: [codecs, defaults]
    request:
      op: data
      searchdirs: [schemas]
      modules: [{name: schema2}]
      format: json
      data_type: data
      data: '{"schema2:a":{"b":{"c":"dflt"}}}'
      validate_options: [present]
      with_defaults: all
      print_options: [shrink, json_no_nested_prefix]
      print_subtree: "/schema2:a/b"
    golden: golden/ut-json-no-nested-prefix-subtree.json
    assert:
      # C CHECK_STRING: subtree.json == {"b":{"c":"dflt"}} (LYD_PRINT_SHRINK).
      verdict: valid
      result: '{"b":{"c":"dflt"}}'
      rfc: []
      deviation: null
