fixtures:
  - id: pcre-compat/errors
    dir: pcre-compat
    source: {url: "hand-written (this repo), see issue 73", commit: null, license: BSD-3-Clause}   # libyang-specific: libyang's messages for invalid patterns, PCRE2 10.46 offsets (pattern_compat, D-0031)
    rfc: []
    areas: [types]
    request: {"op": "schema", "context_options": ["pattern_compat"], "searchdirs": ["errors"], "modules": [{"name": "pe01"}, {"name": "pe02"}, {"name": "pe03"}, {"name": "pe04"}, {"name": "pe05"}, {"name": "pe06"}, {"name": "pe07"}, {"name": "pe08"}, {"name": "pe09"}, {"name": "pe10"}, {"name": "pe11"}, {"name": "pe12"}]}
    golden: golden/errors.json
    assert:
      verdict: invalid
      diagnostics:
        - {schema_path: /pe01:l, msg: "Regular expression \"[z-a]\" is not valid (\"a]\": range out of order in character class)."}
        - {schema_path: /pe02:l, msg: "Regular expression \"*a\" is not valid (\"*a\": quantifier does not follow a repeatable item)."}
        - {schema_path: /pe03:l, msg: "Regular expression \"\\i\" is not valid (\"i\": unrecognized character follows \\)."}
        - {schema_path: /pe04:l, msg: "Regular expression \"a]\" is not valid (\"]\": character group doesn't begin with '[')."}
        - {schema_path: /pe05:l, msg: "Regular expression \"\\x{41\" is not valid (\"1\": non-hex character in \\x{} (closing brace missing?))."}
        - {schema_path: /pe06:l, msg: "Regular expression \"\\p{IsFoo}\" is not valid (\"Foo}\": unknown block name)."}
        - {schema_path: /pe07:l, msg: "Regular expression \"[\\d-z]\" is not valid (\"z]\": invalid range in character class)."}
        - {schema_path: /pe08:l, msg: "Regular expression \"\\1\" is not valid (\"1\": reference to non-existent subpattern)."}
        - {schema_path: /pe09:l, msg: "Regular expression \"\\P{IsGreek}\" is not valid (\"\": unknown property after \\P or \\p)."}
        - {schema_path: /pe10:l, msg: "Regular expression \"a{3,2}\" is not valid (\"}\": numbers out of order in {} quantifier)."}
        - {schema_path: /pe11:l, msg: "Regular expression \"(a\" is not valid (\"\": missing closing parenthesis)."}
        - {schema_path: /pe12:l, msg: "Regular expression \"[\\x7F-\\x20]\" is not valid (\"0]\": range out of order in character class)."}
      deviation: null
