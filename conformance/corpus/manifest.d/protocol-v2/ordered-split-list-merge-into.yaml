        - {do: edit, merge_into: '<c xmlns="urn:vibe-ports:yang:conformance:pv2-ordered2"><a>x</a><l><k>k2</k></l><zz>u</zz><l><k>k1</k></l><b>y</b><c>z</c></c>', format: xml, data_type: get, unknown: opaque, parse_options: [ordered]}
