# lyd_diff_siblings of an ordered tree with an interleaved opaque node against a schema-ordered one
fixtures:
  - id: protocol-v2/ordered-diff-interleaved
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.5.7"]
    areas: [codecs]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered2"}]
      steps:
        - {do: parse, format: json, data_type: get, unknown: opaque, parse_options: [ordered], data: '{"pv2-ordered2:c": {"b": "y", "zz": "u", "a": "x"}}'}
        - {do: diff, format: json, data_type: get, parse_only: true, data: '{"pv2-ordered2:c": {"a": "x2", "c": "z"}}'}
        - {do: dump}
    golden: golden/ordered-diff-interleaved.json
