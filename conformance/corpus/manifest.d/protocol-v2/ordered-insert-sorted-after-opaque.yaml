# a sorted insertion into a run that an opaque node follows goes right after its RB predecessor (lyds_link_data_node, tree_data_sorted.c:1021-1039)
fixtures:
  - id: protocol-v2/ordered-insert-sorted-after-opaque
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.5.7"]
    areas: [codecs]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered2"}]
      steps:
        - {do: parse, format: json, data_type: get, unknown: opaque, parse_options: [ordered], data: '{"pv2-ordered2:c": {"ll": [3], "zz": "u", "c": "z"}}'}
        - {do: edit, insert_term: {parent: /pv2-ordered2:c, name: ll, value: "5"}}
        - {do: edit, insert_term: {parent: /pv2-ordered2:c, name: ll, value: "1"}}
        - {do: dump}
    golden: golden/ordered-insert-sorted-after-opaque.json
