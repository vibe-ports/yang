# lyd_validate_module of a module whose data starts at the tree's first root and precedes its missing defaults, nothing after it once the earlier root out of schema order is deleted (ordered input): every anchor search runs off the end, and each default goes after first->prev, the last sibling
fixtures:
  - id: protocol-v2/ordered-implicit-first-root-end
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.9.3"]
    areas: [validation]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered10"}, {name: "pv2-ordered11"}]
      steps:
        - {do: parse, format: json, data_type: data, parse_only: true, unknown: opaque, parse_options: [ordered], data: '{"pv2-ordered10:marker": "m", "pv2-ordered10:p1": "p"}'}
        - {do: edit, delete: /pv2-ordered10:marker}
        - {do: validate, module: pv2-ordered10, validate_options: [not_final]}
        - {do: dump}
    golden: golden/ordered-implicit-first-root-end.json
