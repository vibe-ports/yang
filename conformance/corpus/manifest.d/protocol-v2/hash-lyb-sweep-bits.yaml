fixtures:
  # libyang v5.8.6 tree_data.c:2280-2295 preserves the source terminal hash on
  # cross-context dup; tree_data.c:1714-1716 rejects unequal hashes before values.
  # Source strings equal the target canonical text. Each lyb-* compare must be
  # LY_ENOT; text-* controls must be LY_SUCCESS. Hashing canonical text instead
  # would turn every lyb-* comparison into LY_SUCCESS (mutation-tested).
  - id: protocol-v2/hash-lyb-sweep-bits
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: [] # Libyang-specific stored hashes, not a YANG equivalence assertion.
    areas: [operations, types]
    request:
      op: sequence
      searchdirs: [hash-sweep-source]
      modules: [{name: pv2-hash-sweep}]
      context_options: [no_yanglibrary]
      steps:
        - {"do": "parse", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-bits-empty></lyb-bits-empty><lyb-bits-low>low</lyb-bits-low><lyb-bits-high>high</lyb-bits-high><lyb-bits-both>low high</lyb-bits-both></r>"}
        - {"do": "dup", "node": "/pv2-hash-sweep:r", "options": ["recursive"], "target": {"searchdirs": ["hash-sweep-target", "../types/schemas"], "modules": [{"name": "pv2-hash-sweep"}], "context_options": ["no_yanglibrary"]}}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-bits-empty[1]", "second": "/pv2-hash-sweep:r/lyb-bits-empty[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-bits-empty></lyb-bits-empty></r>"}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-bits-low[1]", "second": "/pv2-hash-sweep:r/lyb-bits-low[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-bits-low>low</lyb-bits-low></r>"}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-bits-high[1]", "second": "/pv2-hash-sweep:r/lyb-bits-high[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-bits-high>high</lyb-bits-high></r>"}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-bits-both[1]", "second": "/pv2-hash-sweep:r/lyb-bits-both[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-bits-both>low high</lyb-bits-both></r>"}
    golden: golden/hash-lyb-sweep-bits.json
