        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-union-nested-int[1]", "second": "/pv2-hash-sweep:r/lyb-union-nested-int[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-union-nested-int>513</lyb-union-nested-int></r>"}
