# lyd_validate_all of two modules whose roots interleave (ordered input): each module's defaults come choices first, out of schema order, with an NP container among them
fixtures:
  - id: protocol-v2/ordered-implicit-all-modules
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.9.3"]
    areas: [validation]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered10"}, {name: "pv2-ordered11"}]
      steps:
        - {do: parse, format: json, data_type: data, parse_only: true, parse_options: [ordered], data: '{"pv2-ordered11:x": "x", "pv2-ordered10:marker": "m", "pv2-ordered11:y": "y"}'}
        - {do: validate, validate_options: [not_final]}
        - {do: dump}
    golden: golden/ordered-implicit-all-modules.json
