# a later opaque node is appended after the last sibling, a schema node after an opaque one included (lyd_insert_node_last)
fixtures:
  - id: protocol-v2/ordered-insert-opaque-end
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.5.7"]
    areas: [codecs]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered2"}]
      steps:
        - {do: parse, format: json, data_type: get, unknown: opaque, parse_options: [ordered], data: '{"pv2-ordered2:c": {"a": "x", "zz": "u", "c": "z"}}'}
        - {do: edit, insert_opaq: {parent: /pv2-ordered2:c, name: yy, value: v, module: pv2-ordered2}}
        - {do: edit, set: {path: /pv2-ordered2:c/d, value: "w"}}
        - {do: dump}
    golden: golden/ordered-insert-opaque-end.json
