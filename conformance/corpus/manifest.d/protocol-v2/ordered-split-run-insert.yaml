# a leaf-list run that an opaque node splits: a sorted insertion goes into the first piece, whose RB tree libyang builds from the leader up to the opaque node (lyds_additionally_create_rb_tree)
fixtures:
  - id: protocol-v2/ordered-split-run-insert
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.5.7"]
    areas: [codecs]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered2"}]
      steps:
        - {do: parse, format: xml, data_type: get, unknown: opaque, parse_options: [ordered], data: '<c xmlns="urn:vibe-ports:yang:conformance:pv2-ordered2"><ll>3</ll><zz>u</zz><ll>1</ll></c>'}
        - {do: edit, insert_term: {parent: /pv2-ordered2:c, name: ll, value: "2"}}
        - {do: dump}
        - {do: edit, insert_term: {parent: /pv2-ordered2:c, name: ll, value: "9"}}
        - {do: dump}
        - {do: edit, delete: "/pv2-ordered2:c/ll[.='3']"}
        - {do: dump}
    golden: golden/ordered-split-run-insert.json
