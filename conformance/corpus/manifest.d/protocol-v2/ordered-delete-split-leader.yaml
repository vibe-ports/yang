# freeing the leader of a split run's second piece: its prev is the opaque node, so it leads its own piece's RB tree (lyds_unlink), and a later insertion goes into that piece
fixtures:
  - id: protocol-v2/ordered-delete-split-leader
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.5.7"]
    areas: [codecs]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered2"}]
      steps:
        - {do: parse, format: xml, data_type: get, unknown: opaque, parse_options: [ordered], data: '<c xmlns="urn:vibe-ports:yang:conformance:pv2-ordered2"><a>x</a><b>y</b><ll>4</ll><ll>2</ll><zz>u</zz><ll>3</ll><c>z</c></c>'}
        - {do: edit, insert_term: {parent: /pv2-ordered2:c, name: ll, value: "1"}}
        - {do: edit, insert_term: {parent: /pv2-ordered2:c, name: ll, value: "0"}}
        - {do: edit, delete: "/pv2-ordered2:c/ll[.='0']"}
        - {do: dump}
        - {do: edit, insert_term: {parent: /pv2-ordered2:c, name: ll, value: "5"}}
        - {do: dump}
    golden: golden/ordered-delete-split-leader.json
