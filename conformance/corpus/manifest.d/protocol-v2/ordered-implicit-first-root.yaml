# lyd_validate_module of a module whose data starts at the tree's first root, before an opaque root (ordered input): lyd_validate passes the tree as first, and every default's anchor search, choices first, starts at the tree's first node
fixtures:
  - id: protocol-v2/ordered-implicit-first-root
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.9.3"]
    areas: [validation]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered10"}, {name: "pv2-ordered11"}]
      steps:
        - {do: parse, format: json, data_type: data, parse_only: true, unknown: opaque, parse_options: [ordered], data: '{"pv2-ordered10:p1": "p", "pv2-ordered10:zz": "u", "pv2-ordered10:marker": "m"}'}
        - {do: validate, module: pv2-ordered10, validate_options: [not_final]}
        - {do: dump}
    golden: golden/ordered-implicit-first-root.json
