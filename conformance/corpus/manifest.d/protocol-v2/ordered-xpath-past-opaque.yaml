# an XPath name test past the first opaque sibling of a set without a children table: the hashed child lookup (lyd_find_sibling_val) stops at the opaque node
fixtures:
  - id: protocol-v2/ordered-xpath-past-opaque
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.5.7"]
    areas: [codecs]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered2"}]
      steps:
        - {do: parse, format: json, data_type: get, unknown: opaque, parse_options: [ordered], data: '{"pv2-ordered2:c": {"a": "x", "zz": "u", "b": "y"}}'}
        - {do: xpath, xpath: /pv2-ordered2:c/b}
        - {do: xpath, xpath: /pv2-ordered2:c/a}
        - {do: xpath, xpath: "/pv2-ordered2:c/*"}
    golden: golden/ordered-xpath-past-opaque.json
