# LYD_PARSE_ORDERED with a children table: a later insertion's anchor is the first instance of the next schema sibling, past the opaque node (tree_data.c:520-535)
fixtures:
  - id: protocol-v2/ordered-insert-hashed
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.5.7"]
    areas: [codecs]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered2"}]
      steps:
        - {do: parse, format: json, data_type: get, unknown: opaque, parse_options: [ordered], data: '{"pv2-ordered2:c": {"a": "x", "zz": "u", "c": "z", "ll": [1, 2]}}'}
        - {do: edit, set: {path: /pv2-ordered2:c/b, value: "y"}}
        - {do: dump}
    golden: golden/ordered-insert-hashed.json
