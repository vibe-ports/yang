# the when pass deletes the root gone, then the leafref ref to it is resolved (plain parse): libyang deleted gone first, so ref's required instance is missing
fixtures:
  - id: protocol-v2/when-dead-root-leafref-plain
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.21.5"]
    areas: [validation]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered15"}]
      steps:
        - {do: parse, format: json, data_type: data, parse_only: true, parse_options: [when_true], data: '{"pv2-ordered15:gone": "x", "pv2-ordered15:ref": "x"}'}
        - {do: validate, module: pv2-ordered15, validate_options: [not_final]}
        - {do: dump}
    golden: golden/when-dead-root-leafref-plain.json
