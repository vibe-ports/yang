fixtures:
  # libyang v5.8.6 tree_data.c:2280-2295 preserves the source terminal hash on
  # cross-context dup; tree_data.c:1714-1716 rejects unequal hashes before values.
  # Source strings equal the target canonical text. Each lyb-* compare must be
  # LY_ENOT; text-* controls must be LY_SUCCESS. Hashing canonical text instead
  # would turn every lyb-* comparison into LY_SUCCESS (mutation-tested).
  - id: protocol-v2/hash-lyb-sweep-time
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: [] # Libyang-specific stored hashes, not a YANG equivalence assertion.
    areas: [operations, types]
    request:
      op: sequence
      searchdirs: [hash-sweep-source]
      modules: [{name: pv2-hash-sweep}]
      context_options: [no_yanglibrary]
      steps:
        - {"do": "parse", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-time-known>00:00:01+00:00</lyb-time-known><lyb-time-offset>02:00:01+00:00</lyb-time-offset><lyb-time-fraction-known>00:00:01.25+00:00</lyb-time-fraction-known><lyb-time-fraction-offset>02:00:01.25+00:00</lyb-time-fraction-offset><lyb-time-unknown>00:00:01Z</lyb-time-unknown><lyb-time-fraction-unknown>00:00:01.25Z</lyb-time-fraction-unknown></r>"}
        - {"do": "dup", "node": "/pv2-hash-sweep:r", "options": ["recursive"], "target": {"searchdirs": ["hash-sweep-target", "../types/schemas"], "modules": [{"name": "pv2-hash-sweep"}], "context_options": ["no_yanglibrary"]}}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-time-known[1]", "second": "/pv2-hash-sweep:r/lyb-time-known[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-time-known>00:00:01+00:00</lyb-time-known></r>"}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-time-offset[1]", "second": "/pv2-hash-sweep:r/lyb-time-offset[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-time-offset>00:00:01-02:00</lyb-time-offset></r>"}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-time-fraction-known[1]", "second": "/pv2-hash-sweep:r/lyb-time-fraction-known[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-time-fraction-known>00:00:01.25+00:00</lyb-time-fraction-known></r>"}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-time-fraction-offset[1]", "second": "/pv2-hash-sweep:r/lyb-time-fraction-offset[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-time-fraction-offset>00:00:01.25-02:00</lyb-time-fraction-offset></r>"}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-time-unknown[1]", "second": "/pv2-hash-sweep:r/lyb-time-unknown[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-time-unknown>00:00:01Z</lyb-time-unknown></r>"}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-time-fraction-unknown[1]", "second": "/pv2-hash-sweep:r/lyb-time-fraction-unknown[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-time-fraction-unknown>00:00:01.25Z</lyb-time-fraction-unknown></r>"}
