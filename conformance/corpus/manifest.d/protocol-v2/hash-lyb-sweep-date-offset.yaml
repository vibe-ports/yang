fixtures:
  # libyang v5.8.6 tree_data.c:2280-2295 preserves the source terminal hash on
  # cross-context dup; tree_data.c:1714-1716 rejects unequal hashes before values.
  # Source strings equal the target canonical text. Each lyb-* compare must be
  # LY_ENOT; text-* controls must be LY_SUCCESS. Hashing canonical text instead
  # would turn every lyb-* comparison into LY_SUCCESS (mutation-tested).
  # Reverse direction: parse typed dates with offsets, then duplicate to string.
  # Date canonicalization drops the hour; the retained typed hash must differ
  # from a fresh string containing that exact canonical date.
  - id: protocol-v2/hash-lyb-sweep-date-offset
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: [] # Libyang-specific stored hashes, not a YANG equivalence assertion.
    areas: [operations, types]
    request:
      op: sequence
      searchdirs: [hash-sweep-target, ../types/schemas]
      modules: [{name: pv2-hash-sweep}]
      context_options: [no_yanglibrary]
      steps:
        - {"do": "parse", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-date-positive-offset>2024-01-02+02:00</lyb-date-positive-offset><lyb-date-negative-offset>2024-01-02-02:00</lyb-date-negative-offset></r>"}
        - {"do": "dup", "node": "/pv2-hash-sweep:r", "options": ["recursive"], "target": {"searchdirs": ["hash-sweep-source"], "modules": [{"name": "pv2-hash-sweep"}], "context_options": ["no_yanglibrary"]}}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-date-positive-offset[1]", "second": "/pv2-hash-sweep:r/lyb-date-positive-offset[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-date-positive-offset>2024-01-01+00:00</lyb-date-positive-offset></r>"}
        - {"do": "compare", "first": "/pv2-hash-sweep:r/lyb-date-negative-offset[1]", "second": "/pv2-hash-sweep:r/lyb-date-negative-offset[1]", "format": "xml", "data_type": "data", "parse_only": true, "data": "<r xmlns=\"urn:hash-sweep\"><lyb-date-negative-offset>2024-01-02+00:00</lyb-date-negative-offset></r>"}
    golden: golden/hash-lyb-sweep-date-offset.json
