# the when pass deletes x, which separates the leaf-list s, before it evaluates guard's when (deref of /c/s[2]): libyang unlinks x at once, so s=1, s=2 is one run and the position finds s=2
fixtures:
  - id: protocol-v2/ordered-when-dead-separator-position
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.21.5"]
    areas: [validation]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered14"}]
      steps:
        - {do: parse, format: xml, data_type: data, parse_only: true, unknown: opaque, parse_options: [ordered, when_true], data: '<guard xmlns="urn:vibe-ports:yang:conformance:pv2-ordered14">g</guard><ref xmlns="urn:vibe-ports:yang:conformance:pv2-ordered14" xmlns:o="urn:vibe-ports:yang:conformance:pv2-ordered14">/o:c/o:s[2]</ref><c xmlns="urn:vibe-ports:yang:conformance:pv2-ordered14"><s>1</s><x>x</x><s>2</s></c>'}
        - {do: validate, module: pv2-ordered14, validate_options: [not_final]}
        - {do: dump}
    golden: golden/ordered-when-dead-separator-position.json
