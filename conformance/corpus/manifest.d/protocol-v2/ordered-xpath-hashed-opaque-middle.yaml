# a hashed child lookup that misses in a set with a children table falls back to lyd_find_sibling_opaq_next, which searches only the trailing opaque block: an opaque node of the name in the middle is not found
fixtures:
  - id: protocol-v2/ordered-xpath-hashed-opaque-middle
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: ["RFC7950#7.5.7"]
    areas: [codecs]
    request:
      op: sequence
      searchdirs: [schemas]
      context_options: ["no_yanglibrary"]
      modules: [{name: "pv2-ordered2"}]
      steps:
        - {do: parse, format: json, data_type: get, unknown: opaque, parse_options: [ordered], data: '{"pv2-ordered2:c": {"a": "x", "b": false, "c": "z", "d": "d", "ll": [1]}}'}
        - {do: xpath, xpath: /pv2-ordered2:c/b}
        - {do: xpath, xpath: /pv2-ordered2:c/a}
    golden: golden/ordered-xpath-hashed-opaque-middle.json
