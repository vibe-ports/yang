        - {do: diff, format: json, data_type: get, unknown: opaque, parse_options: [ordered], data: '{"pv2-ordered2:c": {"a": "x", "zz": "u"}}'}
        - {do: dup, node: /pv2-ordered2:c, options: [recursive], target: {searchdirs: [schemas], modules: [{name: "pv2-ordered2"}], context_options: ["no_yanglibrary"]}}
