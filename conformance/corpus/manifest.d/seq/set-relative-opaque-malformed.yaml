fixtures:
  - id: seq/set-relative-opaque-malformed
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: [] # lyd_new_path parent handling is libyang-specific.
    areas: [diff]
    request:
      op: sequence
      searchdirs: [schemas]
      modules: [{name: pv2}]
      steps:
        - {do: parse, data: '{"pv2:nosuch":"x"}', unknown: opaque, parse_only: true}
