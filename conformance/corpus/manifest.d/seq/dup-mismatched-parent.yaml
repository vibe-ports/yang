fixtures:
  # lyd_dup_single of /pv2-edit:c/np/d under /pv2-edit:c (not its schema parent, lyd_dup does not
  # check): without a children hash table, lyd_insert_get_next_anchor walks the siblings in the lys_getnext order of d's own parent np: d goes before np (tree_data.c:503-588).
  # The port refuses a parent that is not an instance of the schema parent (D-0124): the
  # dup step fails with LY_EINVAL.
  - id: seq/dup-mismatched-parent
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: []   # libyang API (lyd_dup_single): no RFC behaviour
    areas: [diff]
    request:
      op: sequence
      searchdirs: [schemas]
      modules: [{name: pv2-edit}]
      steps:
        - {do: parse, data: '{"pv2-edit:c":{"np":{"d":7}}}', parse_only: true}
        - {do: dup, node: "/pv2-edit:c/np/d", parent: "/pv2-edit:c"}
        - {do: dump}
    golden: golden/seq-dup-mismatched-parent.json
    assert:
      verdict: invalid
      deviation: D-0124
