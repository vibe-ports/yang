  # The port refuses a parent that is not an instance of the schema parent (D-0124): the
  # dup step fails with LY_EINVAL.
  - id: seq/dup-mismatched-parent-hashed
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: []   # libyang API (lyd_dup_single): no RFC behaviour
    areas: [diff]
    request:
      op: sequence
      searchdirs: [schemas]
      modules: [{name: pv2-edit}]
      steps:
        - {do: parse, data: '{"pv2-edit:c":{"a":"x","b":1,"np":{"d":7},"l":[{"k":"a"}]}}', parse_only: true}
        - {do: dup, node: "/pv2-edit:c/np/d", parent: "/pv2-edit:c"}
        - {do: dump}
    golden: golden/seq-dup-mismatched-parent-hashed.json
