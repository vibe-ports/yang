# libyang v5.8.6: lyd_dup with LYD_DUP_NO_LYDS selects LAST_BY_SCHEMA/LAST at tree_data.c:2461-2478 because lyd_diff_apply_r actually uses DEFAULT at diff.c:1865-1874. lyd_trim_xpath frees in DFS order at tree_data.c:3633-3689; lyds_unlink at tree_data_sorted.c:1332-1355 retains the index for 5, so lyd_insert_node at tree_data.c:801-832 inserts 4 before it and native bucket dst orders are [3,5,9,1], [5,9,1], and [4,5,9,1].
