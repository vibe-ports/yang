fixtures:
  # a list instance without LYD_DUP_RECURSIVE keeps its keys
  - id: seq/dup-single-keys
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: []   # libyang API (lyd_dup_single, lyd_dup_siblings): no RFC behaviour
    areas: [diff]
