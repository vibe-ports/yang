        - {do: edit, set: {path: "/pv2-edit:c/l[k='b']"}}
        - {do: edit, set: {path: "/pv2-edit:c/ll", value: "b"}}
        - {do: edit, set: {path: "/pv2-edit:c/ll", value: "a"}}
        - {do: edit, set: {path: "/pv2-edit:c/np/d", value: "7"}}
        - {do: dup, node: "/pv2-edit:c/l[k='a']"}
