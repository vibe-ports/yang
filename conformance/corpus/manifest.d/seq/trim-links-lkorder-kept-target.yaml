        - {do: trim, xpath: "/pv2-lkorder:c/a/r1 | /pv2-lkorder:c/a/r3 | /pv2-lkorder:c/a/r5 | /pv2-lkorder:c/b/t[.='x']"}
        - {do: links}
        - {do: dump}
    golden: golden/seq-trim-links-lkorder-kept-target.json
