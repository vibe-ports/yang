fixtures:
  - id: seq/set-relative-missing-key
    dir: protocol-v2
    source: {url: "hand-written (this repo)", commit: null, license: BSD-3-Clause}
    rfc: [] # lyd_new_path parent handling is libyang-specific.
    areas: [diff]
    request:
      op: sequence
      searchdirs: [schemas]
      modules: [{name: pv2}]
      steps:
        - {do: edit, set: {path: /pv2:c/mode, value: "on"}}
        # lyd_new_path(/pv2:c, "l") without the key predicate: lyd_new_path_check_find_lypath names the original path "l".
        # The engine reports a relative set under a retained parent unsupported (U-0110 class
        # relative-set-parent: Tree.NewPath has no parent argument, #255).
        - {do: edit, set: {path: "l", value: "x"}}
        - {do: dump}
    golden: golden/seq-set-relative-missing-key.json
