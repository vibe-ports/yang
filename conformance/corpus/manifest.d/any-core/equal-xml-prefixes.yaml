    # Known-module prefixes compare by module identity; unknown-module prefixes
    # remain unequal even when both namespace declarations name the same URI.
    rfc: [] # Core comparison semantics are libyang API contracts.
    areas: [operations, codecs]
    request:
      op: sequence
      searchdirs: [schemas]
      modules: [{name: ac}]
      context_options: [no_yanglibrary]
      steps:
        - do: parse
          format: xml
          data_type: data
          parse_only: true
          data: '<data xmlns="urn:tests:any-core"><item xmlns="urn:tests:opaque" xmlns:p="urn:tests:any-core">p:c</item></data>'
        - do: compare
          format: xml
          data_type: data
          parse_only: true
          options: []
          data: '<data xmlns="urn:tests:any-core"><item xmlns="urn:tests:opaque" xmlns:q="urn:tests:any-core">q:c</item></data>'
        - do: parse
          format: xml
          data_type: data
          parse_only: true
          data: '<data xmlns="urn:tests:any-core"><item xmlns="urn:tests:opaque" xmlns:p="urn:tests:unloaded">p:c</item></data>'
        - do: compare
          format: xml
          data_type: data
          parse_only: true
          options: []
          data: '<data xmlns="urn:tests:any-core"><item xmlns="urn:tests:opaque" xmlns:q="urn:tests:unloaded">q:c</item></data>'
