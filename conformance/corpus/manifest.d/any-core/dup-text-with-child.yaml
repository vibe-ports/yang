    rfc: [] # lyd_any_copy_value rejects child and text together (tree_data_new.c:326).
    areas: [operations]
    request:
      op: sequence
      searchdirs: [schemas]
      modules: [{name: ac-r6}]
      steps:
        - do: parse
          format: xml
          data_type: data
          parse_only: true
          data: '<xml xmlns="urn:tests:any-core-r6">plain text</xml><target xmlns="urn:tests:any-core-r6">value</target>'
        - do: dup
          node: /ac-r6:target
          parent: /ac-r6:xml
          options: []
        - do: dup
          node: /ac-r6:xml
          options: []
    golden: golden/dup-text-with-child.json
    assert: {verdict: invalid, rc: LY_EINVAL}
