    dir: protocol-v2
    source: *own
    rfc: ["RFC7950#8.3.1"]
    areas: [codecs]
    request:
      op: data
      searchdirs: [schemas]
      modules: [{name: pv2}]
      format: json
      data_type: config
      parse_only: true
      unknown: reject
      data_file: data/unknown.json
    golden: golden/unknown-reject.json
    assert:
      verdict: invalid
      rfc: ["RFC7950#8.3.1"]
      diagnostics:
        - {level: error, vecode_name: LYVE_REFERENCE, data_path: /pv2:c}
      deviation: null

  - id: protocol-v2/unknown-skip
    dir: protocol-v2
    source: *own
    rfc: []   # libyang lenient parse (no LYD_PARSE_STRICT): unknown data dropped; no RFC mode
    areas: [codecs]
    request:
      op: data
      searchdirs: [schemas]
      modules: [{name: pv2}]
      format: json
      data_type: config
      parse_only: true
