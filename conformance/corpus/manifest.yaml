      rfc: ["RFC7950#7.13.2"]
      deviation: null

  # the refine merge resolves the prefixes of every pending refine of the same length in the
  # module of the new refine: "a" of the outer refine is not defined in refine-merge-pb
  - id: refine/merge-prefix-other-module
    dir: compile
    source: *own
