    request:
      op: data
      searchdirs: [schemas]
      modules: [{name: basic, features: [jumbo]}]
      format: json
      data_type: config
      data_file: data/range.json
      with_defaults: explicit
    golden: golden/range.json
    assert:
      verdict: invalid
      rfc: ["RFC7950#9.2.4"]
      diagnostics:
        - {vecode_name: LYVE_DATA, data_path: /basic:sys/mtu}
      deviation: null

