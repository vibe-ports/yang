  - id: protocol-v2/unknown-opaque
    dir: protocol-v2
    source: *own
    rfc: []   # libyang LYD_PARSE_OPAQ: unknown data kept as opaque nodes; no RFC mode
    areas: [codecs]
    request:
      op: data
      searchdirs: [schemas]
      modules: [{name: pv2}]
      format: json
      data_type: config
      parse_only: true
