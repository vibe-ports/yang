    golden: golden/xpath-count.json
    assert:
      verdict: valid
      rfc: ["XPath1.0#4.1"]
      deviation: null

  - id: basic/diff
    dir: basic
    source: *own
    rfc: []   # libyang diff format (yang:operation metadata), no RFC
    areas: [diff]
    request:
      op: diff
      searchdirs: [schemas]
      modules: [{name: basic, features: [jumbo]}]
      format: json
      data_type: config
      first_file: data/valid.json
      second_file: data/valid2.json
    golden: golden/diff.json

  # ---- protocol-v2: oracle v2 dumps (typed tree, schema_tree, sequence, unknown policy) ----

  - id: protocol-v2/when-auto-delete
    dir: protocol-v2
    source: *own
    rfc: ["RFC7950#7.21.5", "RFC7950#8.2"]
    areas: [validation]
    request:
      op: sequence
      searchdirs: [schemas]
      modules: [{name: pv2}]
      steps:
        - {do: parse, format: json, data_type: config, data_file: data/valid.json}
        - {do: edit, set: {path: /pv2:c/mode, value: "off"}}
        - {do: validate, data_type: config}
        - {do: dump, with_defaults: explicit}
    golden: golden/when-auto-delete.json

  - id: protocol-v2/implicit-defaults
    dir: protocol-v2
    source: *own
    rfc: ["RFC7950#7.6.1", "RFC7950#7.7.2", "RFC7950#7.9.3"]
    areas: [defaults]
    request:
      op: data
      searchdirs: [schemas]
      modules: [{name: pv2}]
      format: json
      data_type: config
      data_file: data/valid.json
      with_defaults: explicit
    golden: golden/implicit-defaults.json
    assert:
      verdict: valid
      rfc: ["RFC7950#7.6.1"]
      deviation: null

  - id: protocol-v2/union-member
    dir: protocol-v2
    source: *own
    rfc: ["RFC7950#9.12"]
    areas: [types]
    request:
      op: sequence
      searchdirs: [schemas]
      modules: [{name: pv2}]
      steps:
        # u: int8 | percent (typedef) | string; u2: percent | leafref ../l/k
        - {do: parse, format: json, data_type: config, data: '{"pv2:c": {"u": "abc", "l": [{"k": "a"}], "u2": "a"}}'}
        - {do: edit, set: {path: /pv2:c/u, value: "-5"}}
        - {do: edit, set: {path: /pv2:c/u2, value: "50"}}
        - {do: validate, data_type: config}
    golden: golden/union-member.json
    assert:
      verdict: valid
      rfc: ["RFC7950#9.12"]
      deviation: null

  - id: protocol-v2/choice-default-case
    dir: protocol-v2
    source: *own
    rfc: ["RFC7950#7.9.3", "RFC7950#7.9.1"]
    areas: [defaults, validation]
    request:
      op: sequence
      searchdirs: [schemas]
      modules: [{name: pv2}]
      steps:
        - {do: validate, data_type: config}
        - {do: edit, merge: '{"pv2:c": {"s": "picked"}}', data_type: config}
        - {do: validate, data_type: config}
        - {do: dump, with_defaults: all}
    golden: golden/choice-default-case.json
    assert:
      verdict: valid
      rfc: ["RFC7950#7.9.3"]
      deviation: null

