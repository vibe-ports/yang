  # End state (RFC7950#8.3.2, #7.21.5): boost auto-deleted once rate=50 makes its when false; deleting rate
  # re-creates the default 100 (implicit diff op create); shared-weight stays the default-case default.
  - id: m1/sequence-when-auto-delete
    dir: m1
    source: *m1src
    rfc: ["RFC7950#7.21.5", "RFC7950#7.6.1", "RFC7950#7.9.3", "RFC7950#8.3.2"]
    areas: [validation, defaults]
    request:
      op: sequence
      searchdirs: [schemas]
      modules:
        - {name: ietf-interfaces, features: [arbitrary-names, pre-provisioning, if-mib]}
        - {name: iana-if-type}
        - {name: ietf-ip, features: [ipv4-non-contiguous-netmasks]}
        - {name: m1-ext, features: [fast-path]}
      steps:
        - {do: parse, format: json, data_type: config, data_file: data/seq-start.json}
        - {do: validate, data_type: config}
        - {do: edit, set: {path: "/ietf-interfaces:interfaces/interface[name='eth0']/m1-ext:m1/rate", value: "50"}}
        - {do: validate, data_type: config}
        - {do: edit, delete: "/ietf-interfaces:interfaces/interface[name='eth0']/m1-ext:m1/rate"}
        - {do: validate, data_type: config}
        - {do: dump, with_defaults: all}
    golden: golden/sequence-when-auto-delete.json
    assert:
      verdict: valid
      rfc: ["RFC7950#7.21.5"]
      deviation: null

