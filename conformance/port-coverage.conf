# Port coverage report (make port-coverage, conformance/cmd/portcov; issue #77).
#   root <glob>            an entry point of the pilot (function name glob)
#   skip <glob> <reason>   out of scope, not counted and not followed: a glob with '/' matches the
#                          libyang file (src/...), any other the function name

# Entry points of the pilot: load and compile modules, parse/validate/print data.
root ly_ctx_new
root ly_ctx_load_module
root ly_ctx_compile
root lyd_parse_data
root lyd_validate_all
root lyd_print_mem
root lyd_print_all
root lyd_print_tree
# Plugin callbacks are called through function pointers, which the call graph cannot follow.
root lyplg_type_store_*
root lyplg_type_validate_*
root lyplg_type_compare_*
root lyplg_type_sort_*
root lyplg_type_print_*
root annotation_parse
root annotation_compile
root nacm_parse
root nacm_compile

# Formats and features outside v1 (PLAN §1).
skip src/parser_yin.c YIN input (U-0021)
skip src/printer_yin.c YIN output, not in v1
skip src/parser_lyb.c LYB binary format, not in v1
skip src/printer_lyb.c LYB binary format, not in v1
skip src/lyb.c LYB binary format, not in v1
skip src/printer_yang.c schema printers, not in v1
skip src/printer_tree.c schema printers, not in v1
skip src/printer_context.c compiled-context printing, not in v1
skip src/printer_schema.c schema printers, not in v1
skip src/plugins_exts/schema_mount.c schema mount (U-0024)
skip src/plugins_exts/structure.c structure extensions (U-0023)
skip src/plugins_exts/yangdata.c yang-data (U-0023)
skip src/plugins_exts/openconfig.c openconfig extensions (U-0025)
skip *_lyb lyb callbacks of the type plugins, not in v1
skip lyplg_type_*_lyb_* lyb callbacks of the type plugins, not in v1

# C infrastructure the Go design replaces (memory, logging, I/O handlers, generic containers).
skip *_free memory management (Go GC)
skip *_free_* memory management (Go GC)
skip lydict_* string dictionary (Go strings)
skip ly_set_* generic set (Go slices and maps)
skip lyht_* hash table (Go maps)
skip ly_log* logging (Go diagnostics)
skip ly_vlog* logging (Go diagnostics)
skip ly_err_* logging (Go diagnostics)
skip ly_in_* input handlers (io.Reader)
skip ly_out_* output handlers (io.Writer)
skip ly_write* output handlers (io.Writer)
skip ly_print* output handlers (io.Writer)
skip ly_realloc memory management (Go GC)
